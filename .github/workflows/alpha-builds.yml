name: Native alpha packages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: windows-x64
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.7'
      - name: Syntax, geometry, hostile inputs and HTTP security
        working-directory: turtle-lab
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt
      - name: Check packaging dependencies for known vulnerabilities
        run: python packaging/audit.py
      - name: Build portable archive
        run: python packaging/build.py --target '${{ matrix.target }}'
      - name: Test extracted native executable and verify bundle manifest
        run: |
          for archive in release-dist/*; do
            python packaging/smoke.py "$archive"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TurtleLab-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 14
